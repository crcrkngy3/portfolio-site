<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="style.css">
  <title>mamori動画表示ページ</title>
  <meta name="description" content="ルームフレグランス mamoriをイメージし作成した仮想サイトです。">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="../img/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kiwi+Maru&family=Poppins:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="../css/ress.css" media="all" rel="stylesheet" type="text/css" />
</head>
<body>

  <!-- メインコンテンツ -->
  <main class="hero-section">

    <!-- PC用プレビュー -->
    <div class="main-visual">
      <div class="douga-text">
        <p>操作画面(PC用)のプレビューです</p>

        <img src="img/mamori-preview-pc.gif" alt="PC操作動画">
               
        <section class="text-section">
          <div class="text-container">
            <div class="text-card">
              <p>・マウスを置いたときにボタンの色が変わるなど、『押せること』が直感的に伝わるデザインのバリエーションを作成しました。</p>
            </div>
            
            <div class="text-card">
              <p>・ボタンをクリックすると、ページ内の特定の場所や上部へ瞬時に移動する動作（シミュレーション）を設定しました。</p>
            </div>
          </div>
        </section>

        <!-- サイトに移動するボタン -->
        <div class="view-site-container">
          <a href="https://www.figma.com/..." target="_blank" rel="noopener noreferrer" class="btn-view-site">
            View Figma →
          </a>
        </div>
      </div>
    </div>

    <!-- 携帯用プレビュー -->
    <div class="second-visual">
      <div class="douga-text">
        <p>操作画面(携帯用)のプレビューです</p>

        <img src="img/mamori-preview-phone.gif" alt="PC操作動画">
               
        <section class="text-section">
          <div class="text-container">
            <div class="text-card">
              <p>・スマホ使用時に操作のしやすいボタンの高さや、文字サイズを意識し作成しました。</p>
            </div>
            
            <div class="text-card">
              <p>・画面をすっきり見せるため、クリックするとメニューが飛び出す折りたたみ式のナビゲーション（三本線のアイコン）を導入しました。</p>
            </div>
          </div>
        </section>

        <!-- サイトに移動するボタン -->
        <div class="view-site-container">
          <a href="https://www.figma.com/design/qXazKRm8sb412V5glu17SF/..." target="_blank" rel="noopener noreferrer" class="btn-view-site">
  View Figma →
</a>
        </div>
      </div>
    </div>

  </main>

</body>
</html>

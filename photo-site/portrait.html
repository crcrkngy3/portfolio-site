<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ポートレートをまとめたページです。">
  <link rel="icon" href="img/logo.webp">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  
  <title>Portrait | bito.photo</title>

   <!-- フォントの指定 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- CSSの設定 -->
  <link href="css/ress.css" media="all" rel="stylesheet" type="text/css" />
  <link href="css/page.css" media="all" rel="stylesheet" type="text/css" />
  <link href="css/header.css" media="all" rel="stylesheet" type="text/css" />

</head>
<body>

  <!-- 全体の箱をwrapperとする -->
  <div class="wrapper">

    <!-- ヘッダー -->
    <header class="header">
      <div class="container">
        <h1 class="header-logo">
          <a href="index.html"><img src="img/logo.webp" alt="ホームへ戻る"></a>
        </h1>
        <nav class="gnav">
          <ul class="gnav-list">
            <li class="gnav-item"><a href="index.html">Home</a></li>
            <li class="gnav-item"><a href="gallery.html">Gallery</a></li>
            <li class="gnav-item"><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- /ヘッダー -->

    <!-- メインコンテンツ -->
    <main class="content">
      <section class="photo-gallery container blur-in">
        
        <!-- 1段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait01.webp" alt="写真1">
          </div>
        </div>

        <!-- 2段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait02.webp" alt="写真2">
          </div>
        </div>

        <!-- 3段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait03.webp" alt="写真3">
          </div>
        </div>

        <!-- 4段目 -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/portrait/portrait04.webp" alt="写真4">
          </div>
          <div class="photo-item">
            <img src="img/portrait/portrait05.webp" alt="写真5">
          </div>
        </div>

        <!-- 5段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait08.webp" alt="写真6">
          </div>
        </div>

        <!-- 6段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait10.webp" alt="写真7">
          </div>
        </div>

        <!-- 7段目：横長写真 1枚（1列・中央寄せ） -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait09.webp" alt="写真8">
          </div>
        </div>

        <!-- 8段目 -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/portrait/portrait26.webp" alt="写真9">
          </div>
          <div class="photo-item">
            <img src="img/portrait/portrait27.webp" alt="写真10">
          </div>
        </div>

        <!-- 9段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait11.webp" alt="写真11">
          </div>
        </div>

        <!-- 10段目 -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/portrait/portrait12.webp" alt="写真12">
          </div>
          <div class="photo-item">
            <img src="img/portrait/portrait13.webp" alt="写真13">
          </div>
        </div>

        <!-- 11段目 -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/portrait/portrait06.webp" alt="写真14">
          </div>
          <div class="photo-item">
            <img src="img/portrait/portrait07.webp" alt="写真15">
          </div>
        </div>

        <!-- 12段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait22.webp" alt="写真16">
          </div>
        </div>

        <!-- 13段目 -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/portrait/portrait20.webp" alt="写真17">
          </div>
          <div class="photo-item">
            <img src="img/portrait/portrait21.webp" alt="写真18">
          </div>
        </div>

        <!-- 14段目 -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/portrait/portrait17.webp" alt="写真19">
          </div>
        </div>

        <!-- おまけ -->
        <div class="omake-section">
          <p class="gallery-lead">おまけ：逆に写真撮ってくれる人たち、かわいい</p>
          <div class="photo-grid grid-1col">
            <div class="photo-item">
              <img src="img/portrait/omake.webp" alt="おまけ写真">
            </div>
          </div>
        </div>

      </section>

      <!-- 戻るボタン -->
      <div class="back-btn-container">
        <a href="gallery.html" class="back-btn">
          <span class="back-arrow">&larr;</span> Back
        </a>
      </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <div class="copyright">&copy;2026 bito.photo</div>
    </footer>
    <!-- /フッター -->

  </div>
  <!-- /.wrapper -->

</body>
</html>

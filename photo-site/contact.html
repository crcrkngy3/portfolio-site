<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="お問い合わせページです。">
  <link rel="icon" href="img/logo.webp">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  
  <title>Contact | bito.photo</title>

   <!-- フォントの指定 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- CSSの設定 -->
  <link href="css/ress.css" media="all" rel="stylesheet" type="text/css" />
  <link href="css/contact.css" media="all" rel="stylesheet" type="text/css" />
  <link href="css/header.css" media="all" rel="stylesheet" type="text/css" />

</head>
<body>

  <!-- 全体の箱をwrapperとする -->
  <div class="wrapper">

    <!-- ヘッダー -->
    <header class="header">
      <div class="container">
        <h1 class="header-logo">
          <a href="index.html"><img src="img/logo.webp" alt="ホームへ戻る"></a>
        </h1>
        <nav class="gnav">
          <ul class="gnav-list">
            <li class="gnav-item"><a href="index.html">Home</a></li>
            <li class="gnav-item"><a href="gallery.html">Gallery</a></li>
            <li class="gnav-item"><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- /ヘッダー -->

    <!-- メインコンテンツ -->
    <main class="content container">
      <!-- PCは横並び / スマホは縦並びエリア -->
      <div class="contact-wrapper">
        
        <!-- 左側：写真 (MV) -->
        <div class="mv">
          <div class="mv-container">
            <img src="img/photo06.webp" alt="メイン画像" class="blur-in">
            <h2 class="mv-title">CONTACT</h2>
          </div>
        </div>

       <!-- 右側：問い合わせ本文 -->
<section class="contact-section" id="contact">
  <div class="contact-list">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSck2hIAgOPyfAGFdAS_YlAJHqGqAAezut6tFW3b8A-LKgoqxA/viewform?usp=header"
       target="_blank" rel="noopener noreferrer" aria-label="お問い合わせフォームを開く">
      <img src="img/mail.svg" alt="お問い合わせフォーム">
      <span class="contact-btn-text">お問い合わせフォームはこちら</span>
    </a>
  </div>

  <p class="note">
    ※Home下部に来訪者カウンターを設置しています。<br>
    あなたが思う「キリ番」(それぞれの定義なので<br>己が良い番号だと思ったらそうです)だった方は、<br>
    ぜひスクショでお知らせください。何か良いことあるかも。
  </p>
</section>

      </div>
    </main>
    <!-- /メインコンテンツ -->

    <!-- フッター -->
    <footer class="footer">
      <div class="copyright">&copy;2026 bito.photo</div>
    </footer>
    <!-- /フッター -->

  </div>
  <!-- /.wrapper -->

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="町や自然などのスナップをまとめたページです。">
  <link rel="icon" href="img/logo.webp">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  
  <title>Snap | bito.photo</title>

  <!-- フォントの指定 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- CSSの設定 -->
  <link href="css/ress.css" media="all" rel="stylesheet" type="text/css" />
  <link href="css/page.css" media="all" rel="stylesheet" type="text/css" />
</head>
<body>

  <!-- 全体の箱をwrapperとする -->
  <div class="wrapper">

    <!-- ヘッダー -->
    <header class="header">
      <div class="container">
        <h1 class="header-logo">
          <a href="index.html"><img src="img/logo.webp" alt="ホームへ戻る"></a>
        </h1>
        <nav class="gnav">
          <ul class="gnav-list">
            <li class="gnav-item"><a href="index.html">Home</a></li>
            <li class="gnav-item"><a href="gallery.html">Gallery</a></li>
            <li class="gnav-item"><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- /ヘッダー -->

    <!-- メインコンテンツ -->
    <main class="content">
      <section class="photo-gallery container">
        
        <!-- 1段目：縦長写真 2枚（2列） -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/snap/snap01.webp" alt="スナップ写真1">
          </div>
          <div class="photo-item">
            <img src="img/snap/snap02.webp" alt="スナップ写真2">
          </div>
        </div>

        <!-- 2段目：横長写真 1枚（1列・中央寄せ） -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/snap/snap03.webp" alt="スナップ写真3">
          </div>
        </div>

        <!-- 3段目：縦長写真 1枚（1列・大きく見せる） -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/snap/snap04.webp" alt="スナップ写真4">
          </div>
        </div>

        <!-- 4段目：写真 2枚（2列） -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/snap/snap05.webp" alt="スナップ写真5">
          </div>
          <div class="photo-item">
            <img src="img/snap/snap06.webp" alt="スナップ写真6">
          </div>
        </div>

        <!-- 5段目：写真 2枚（2列） -->
        <div class="photo-grid grid-2col">
          <div class="photo-item">
            <img src="img/snap/snap07.webp" alt="スナップ写真7">
          </div>
          <div class="photo-item">
            <img src="img/snap/snap08.webp" alt="スナップ写真8">
          </div>
        </div>

        <!-- 6段目：縦長写真 1枚（1列・大きく見せる） -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/snap/snap10.webp" alt="スナップ写真10">
          </div>
        </div>

        <!-- 7段目：縦長写真 1枚（1列・大きく見せる） -->
        <div class="photo-grid grid-1col">
          <div class="photo-item">
            <img src="img/snap/snap11.webp" alt="スナップ写真11">
          </div>
        </div>

      </section>

      <!-- 戻るボタン -->
      <div class="back-btn-container">
        <a href="gallery.html" class="back-btn">
          <span class="back-arrow">&larr;</span> Back
        </a>
      </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <div class="copyright">&copy;2026 bito.photo</div>
    </footer>
    <!-- /フッター -->

  </div>
  <!-- /.wrapper -->

</body>
</html>
